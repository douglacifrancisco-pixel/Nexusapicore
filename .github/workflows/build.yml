name: Build libltw_angle.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: docker.io/library/ubuntu:22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y git python3 ninja-build cmake android-ndk

    - name: Build ANGLE with patches
      run: |
        ./scripts/download_and_patch_angle.sh

    - name: Build LTW + ANGLE
      run: |
        ./scripts/build_unified.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libltw_angle.so
        path: build/libltw_angle.so
